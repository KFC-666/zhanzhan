<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>湛湛</title>
  <meta name="theme-color" content="#fbf3f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1a1c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="湛湛">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icon-180.png?v=0.8.2">
  <link rel="icon" href="icon-180.png?v=0.8.2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <link rel="stylesheet" href="style.css?v=0.8.2">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main>
      <section class="view" id="view-chat">
        <div class="scroll" id="chat-scroll"><div id="chat-list"></div></div>
        <div class="attach-draft" id="attach-draft" style="display:none"></div>
        <form class="composer" id="composer">
          <button class="attach" id="attach-btn" type="button" aria-label="附加照片或檔案"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.5 11.5 12.3 19.7a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7"/></svg></button>
          <textarea id="chat-input" rows="1" placeholder="跟湛湛說…" enterkeyhint="enter"></textarea>
          <button class="send" id="send-btn" type="submit" aria-label="傳送" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
          </button>
        </form>
      </section>
      <section class="view" id="view-pet"><div class="scroll" id="pet-root"></div></section>
      <section class="view" id="view-photos"><div class="scroll" id="photos-root"></div><button class="fab" id="photos-add">＋ 上傳</button></section>
      <section class="view" id="view-ledger"><div class="scroll" id="ledger-root"></div><button class="fab" id="ledger-add">＋ 記一筆</button></section>
      <section class="view" id="view-mood"><div class="scroll" id="mood-root"></div></section>
      <section class="view" id="view-us"><div class="scroll" id="us-root"></div></section>
    </main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/></svg>聊天</button>
      <button data-tab="pet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M6 10c0-4 3-6 6-6s6 2 6 6c-2-1-3-3-3-3-1 2-4 3-9 3z" fill="currentColor"/></svg>小湛</button>
      <button data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 17"/></svg>相簿</button>
      <button data-tab="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>記帳</button>
      <button data-tab="mood"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1" fill="currentColor"/></svg>日曆</button>
      <button data-tab="us"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>我們</button>
    </nav>
  </div>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
  <div class="viewer" id="viewer"></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="app.js?v=0.8.2"></script>
</body>
</html>
